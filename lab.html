<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ex Nihilo · Multiverse Lab</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: dark; --bg: #05050a; --panel: #0e0e19; --line: #232338; --text: #ecebf7; --dim: #8d8cab; --hot: #ffb020; --alive: #5cf2a6; --dead: #ff5c7a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 ui-monospace, "Cascadia Code", Consolas, Menlo, monospace; }
  header { padding: 20px 24px 14px; display: flex; flex-wrap: wrap; gap: 16px 28px; align-items: end; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font: 800 20px/1 "Segoe UI", system-ui, sans-serif; letter-spacing: .32em; }
  h1 a { color: inherit; text-decoration: none; }
  h1 span { color: var(--dim); font-weight: 500; letter-spacing: .12em; }
  form { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; }
  label { display: grid; gap: 3px; color: var(--dim); font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; }
  input { width: 104px; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: inherit; }
  input[name=seeds] { width: 190px; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--hot); outline-offset: 1px; }
  button { background: var(--text); color: #000; border: 0; border-radius: 6px; padding: 7px 18px; font: inherit; font-weight: 700; cursor: pointer; }
  #summary { padding: 12px 24px; color: var(--dim); min-height: 42px; }
  #summary b { color: var(--text); }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; padding: 4px 24px 40px; }
  .u { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .u.alive { border-color: color-mix(in srgb, var(--alive) 55%, var(--line)); }
  .u canvas { display: block; width: 100%; aspect-ratio: 16 / 9; image-rendering: pixelated; background: #000; }
  .u .meta { padding: 8px 10px 10px; display: grid; gap: 3px; }
  .u .seed a { color: var(--hot); font-weight: 700; }
  .u .state { color: var(--dim); }
  .u.alive .state { color: var(--alive); }
  .u .log { font-size: 10.5px; line-height: 1.5; max-height: 132px; overflow: auto; word-break: break-all; }
  .u .log .birth { color: var(--alive); }
  .u .log .extinction { color: var(--dead); }
  .u .log .majority { color: var(--hot); font-weight: 700; }
</style>
</head>
<body>
<header>
  <h1><a href="./">EX NIHILO</a> <span>/ multiverse lab</span></h1>
  <form id="form">
    <label>universes <input name="n" type="number" min="1" max="64" value="12"></label>
    <label>seed prefix <input name="seed" value="u"></label>
    <label>or exact seeds <input name="seeds" placeholder="u2, amber-void-417"></label>
    <label>give up at epoch <input name="max" type="number" min="100" step="1000" value="150000"></label>
    <label>epochs after first life <input name="after" type="number" min="0" step="1000" value="60000"></label>
    <label>epochs after takeover <input name="settle" type="number" min="0" step="64" value="640"></label>
    <label>step budget <input name="limit" type="number" min="128" step="128" value="8192"></label>
    <label>mutation 1/x <input name="mut" type="number" min="0" value="4096"></label>
    <button>Run</button>
  </form>
</header>
<div id="summary">Each card is an independent universe on its own CPU core, run at full speed with no graphics. None of them is given a replicator. Click a seed to open that universe in the viewer.</div>
<div id="grid"></div>
<script type="module" src="src/lab.js"></script>
</body>
</html>
